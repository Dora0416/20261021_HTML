<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>一起來抽籤｜課堂抽籤機</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131c;
      --panel: #1a1e2b;
      --panel-soft: #222737;
      --text: #f5f6ff;
      --muted: #aab1c5;
      --accent: #a88bff;
      --accent-bright: #c4adff;
      --green: #72e0b0;
      --red: #ff858f;
      --border: #343a4d;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% -20%, #30284e 0, transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.55;
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 30px 24px 48px;
    }

    header { text-align: center; margin-bottom: 27px; }
    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent-bright);
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: .18em;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.2;
      letter-spacing: .04em;
    }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 1.05rem; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(340px, .95fr);
      gap: 20px;
      align-items: start;
    }
    .column { display: grid; gap: 18px; }
    .card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: 0 14px 35px #0002;
    }
    .card h2 {
      margin: 0 0 16px;
      font-size: 1.25rem;
      letter-spacing: .02em;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      padding: 5px;
      margin-bottom: 19px;
      border-radius: 14px;
      background: #10131c;
    }
    .mode-button {
      min-height: 49px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      cursor: pointer;
    }
    .mode-button[aria-pressed="true"] {
      background: var(--accent);
      color: #171323;
    }
    .field-label {
      display: block;
      margin: 0 0 7px;
      font-weight: 750;
    }
    .field-help { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }
    .number-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .number-fields input, textarea, .count-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: #111520;
      color: var(--text);
    }
    .number-fields input { min-height: 49px; padding: 9px 12px; font-size: 1.1rem; }
    textarea {
      min-height: 146px;
      padding: 12px 14px;
      resize: vertical;
      line-height: 1.6;
    }
    input:focus, textarea:focus {
      border-color: var(--accent-bright);
      box-shadow: 0 0 0 3px #a88bff30;
    }
    .hidden { display: none !important; }
    .exclude-field { margin-top: 18px; }
    .exclude-field textarea { min-height: 76px; }

    .draw-options {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 17px;
      align-items: end;
    }
    .count-input { width: 125px; min-height: 49px; padding: 8px 12px; }
    .toggle-row {
      display: flex;
      min-height: 49px;
      gap: 11px;
      align-items: center;
      color: var(--text);
      font-weight: 750;
      cursor: pointer;
    }
    .toggle-row input {
      width: 23px;
      height: 23px;
      margin: 0;
      accent-color: var(--accent);
    }
    .remaining {
      margin: 14px 0 0;
      color: var(--green);
      font-size: 1rem;
      font-weight: 800;
    }

    .stage {
      display: grid;
      min-height: 310px;
      place-content: center;
      margin-bottom: 17px;
      padding: 22px;
      overflow: hidden;
      border: 1px solid #423b63;
      border-radius: 17px;
      background:
        radial-gradient(ellipse at center, #342b50 0, #202031 52%, #171a25 100%);
      text-align: center;
    }
    .stage-label { color: var(--muted); font-size: 1rem; font-weight: 750; }
    .results {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 13px;
    }
    .result-chip {
      display: grid;
      min-width: 115px;
      min-height: 104px;
      place-items: center;
      padding: 12px 20px;
      border: 1px solid #c4adff99;
      border-radius: 18px;
      background: linear-gradient(145deg, #4a3d70, #302744);
      color: #fff;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 900;
      line-height: 1.1;
      overflow-wrap: anywhere;
      box-shadow: 0 7px 22px #08070f55, inset 0 1px #ffffff20;
      animation: pop .45s cubic-bezier(.2, 1.5, .4, 1) both;
    }
    .result-chip.name-result { min-width: 150px; font-size: clamp(1.8rem, 5vw, 2.5rem); }
    @keyframes pop {
      from { opacity: 0; transform: scale(.55) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .draw-button {
      width: 100%;
      min-height: 75px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #c0a8ff, #9676fa);
      color: #1b1530;
      font-size: 1.55rem;
      font-weight: 950;
      letter-spacing: .08em;
      cursor: pointer;
      box-shadow: 0 8px 22px #a88bff30;
      transition: transform .15s, filter .15s;
    }
    .draw-button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-2px); }
    .draw-button:active:not(:disabled) { transform: translateY(1px); }
    .draw-button:disabled { cursor: wait; filter: saturate(.55); opacity: .8; }

    .status {
      min-height: 1.65em;
      margin: 11px 2px 0;
      color: var(--muted);
      font-size: .96rem;
    }
    .status.error { color: var(--red); font-weight: 750; }
    .history-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-head h2 { margin: 0; }
    .reset-button {
      min-height: 42px;
      padding: 7px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-soft);
      color: var(--text);
      font-size: .9rem;
      font-weight: 750;
      cursor: pointer;
    }
    .reset-button:hover { border-color: var(--accent); }
    .history-list {
      display: grid;
      max-height: 220px;
      gap: 8px;
      margin: 0;
      padding: 0;
      overflow: auto;
      list-style: none;
    }
    .history-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--panel-soft);
    }
    .history-empty { color: var(--muted); text-align: center; padding: 12px; }
    .history-time { color: var(--muted); font-size: .84rem; white-space: nowrap; }

    #confetti {
      position: fixed;
      z-index: 5;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 780px) {
      .layout { grid-template-columns: 1fr; }
      .page { padding: 22px 16px 36px; }
      .stage { min-height: 260px; }
    }
    @media (max-width: 420px) {
      .card { padding: 17px; }
      .draw-options { grid-template-columns: 1fr 1fr; gap: 8px; }
      .count-input { width: 100%; }
      .toggle-row { font-size: .9rem; }
      .result-chip { min-width: 90px; min-height: 85px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      .result-chip { animation-duration: .01ms; }
    }
  </style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <main class="page">
    <header>
      <p class="eyebrow">CLASSROOM RANDOM PICKER</p>
      <h1>🎲 一起來抽籤</h1>
      <p class="subtitle">公平抽選，讓每個人都有機會！</p>
    </header>

    <div class="layout">
      <section class="column" aria-label="抽籤設定">
        <div class="card">
          <h2>① 選擇抽籤名單</h2>
          <div class="mode-switch" role="group" aria-label="抽籤模式">
            <button class="mode-button" id="numberMode" type="button" aria-pressed="true">🔢 號碼模式</button>
            <button class="mode-button" id="nameMode" type="button" aria-pressed="false">🧑‍🎓 姓名模式</button>
          </div>

          <div id="numberFields">
            <span class="field-label">號碼範圍</span>
            <div class="number-fields">
              <label>從
                <input id="rangeStart" type="number" value="1" step="1" inputmode="numeric" aria-label="起始號碼">
              </label>
              <label>到
                <input id="rangeEnd" type="number" value="30" step="1" inputmode="numeric" aria-label="結束號碼">
              </label>
            </div>
            <p class="field-help">最多支援 10,000 個號碼。</p>
          </div>

          <div id="nameFields" class="hidden">
            <label class="field-label" for="roster">貼上學生名單</label>
            <textarea id="roster" placeholder="王小明&#10;陳小華&#10;林同學" spellcheck="false"></textarea>
            <p class="field-help" id="savedHint">名單會自動記錄在這台裝置的瀏覽器。</p>
          </div>

          <div class="exclude-field">
            <label class="field-label" for="excluded">排除對象（選填）</label>
            <textarea id="excluded" placeholder="例如：5, 12"></textarea>
            <p class="field-help">可用逗號或換行分隔；姓名請輸入完整姓名。</p>
          </div>
        </div>

        <div class="card">
          <h2>② 設定抽選方式</h2>
          <div class="draw-options">
            <label for="drawCount">
              <span class="field-label">這次抽出幾位？</span>
              <input class="count-input" id="drawCount" type="number" min="1" value="1" step="1" inputmode="numeric">
            </label>
            <label class="toggle-row" for="noRepeat">
              <input id="noRepeat" type="checkbox">
              <span>不重複抽籤</span>
            </label>
          </div>
          <p class="remaining" id="remaining" aria-live="polite">可抽人數：30</p>
        </div>
      </section>

      <section class="column" aria-label="抽籤結果">
        <div class="card">
          <h2>③ 準備好了嗎？</h2>
          <div class="stage" aria-live="polite" aria-atomic="true">
            <span class="stage-label" id="stageLabel">按下按鈕，看看今天的幸運兒！</span>
            <div class="results" id="results"></div>
          </div>
          <button class="draw-button" id="drawButton" type="button">🎉 開始抽籤</button>
          <p class="status" id="status" role="status"></p>
        </div>

        <div class="card">
          <div class="history-head">
            <h2>📋 抽籤紀錄</h2>
            <button class="reset-button" id="resetButton" type="button">重置紀錄</button>
          </div>
          <ol class="history-list" id="history"></ol>
          <p class="sr-only" id="historyAnnouncement" aria-live="polite"></p>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "classroom-picker-roster";
      const MAX_POOL_SIZE = 10000;
      const numberModeButton = document.getElementById("numberMode");
      const nameModeButton = document.getElementById("nameMode");
      const numberFields = document.getElementById("numberFields");
      const nameFields = document.getElementById("nameFields");
      const rosterInput = document.getElementById("roster");
      const rangeStartInput = document.getElementById("rangeStart");
      const rangeEndInput = document.getElementById("rangeEnd");
      const excludedInput = document.getElementById("excluded");
      const drawCountInput = document.getElementById("drawCount");
      const noRepeatInput = document.getElementById("noRepeat");
      const remainingOutput = document.getElementById("remaining");
      const drawButton = document.getElementById("drawButton");
      const resetButton = document.getElementById("resetButton");
      const resultsOutput = document.getElementById("results");
      const stageLabel = document.getElementById("stageLabel");
      const statusOutput = document.getElementById("status");
      const historyOutput = document.getElementById("history");
      const historyAnnouncement = document.getElementById("historyAnnouncement");
      const confettiCanvas = document.getElementById("confetti");
      const confettiContext = confettiCanvas.getContext("2d");

      let mode = "number";
      let isDrawing = false;
      let drawnThisRound = new Set();
      let history = [];
      let confettiFrame = 0;

      function loadRoster() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved !== null) rosterInput.value = saved;
        } catch (error) {
          console.warn("無法讀取瀏覽器中的名單：", error);
          document.getElementById("savedHint").textContent =
            "此瀏覽器無法使用本機儲存；名單仍可抽選，但關閉頁面後不會保留。";
        }
      }

      function saveRoster() {
        try {
          localStorage.setItem(STORAGE_KEY, rosterInput.value);
          document.getElementById("savedHint").textContent =
            "名單已自動記錄在這台裝置的瀏覽器。";
        } catch (error) {
          console.warn("無法儲存名單：", error);
          document.getElementById("savedHint").textContent =
            "無法儲存名單；目前輸入仍可使用，但關閉頁面後不會保留。";
        }
      }

      function setStatus(message, isError) {
        statusOutput.textContent = message;
        statusOutput.classList.toggle("error", Boolean(isError));
      }

      function parseTokens(value) {
        return value.split(/[,\n，\r]+/).map((item) => item.trim()).filter(Boolean);
      }

      function getPool() {
        let pool;
        if (mode === "number") {
          const startText = rangeStartInput.value.trim();
          const endText = rangeEndInput.value.trim();
          const start = Number(startText);
          const end = Number(endText);
          if (startText === "" || endText === "" || !Number.isSafeInteger(start) ||
              !Number.isSafeInteger(end) || start < 1 || end < start) {
            throw new Error("請輸入有效的起訖號碼（正整數，且起始號碼不可大於結束號碼）。");
          }
          if (end - start + 1 > MAX_POOL_SIZE) {
            throw new Error("號碼範圍最多可設定 10,000 個號碼。");
          }
          pool = Array.from({ length: end - start + 1 }, (_, index) => String(start + index));
        } else {
          pool = parseTokens(rosterInput.value);
          if (pool.length === 0) throw new Error("請先貼上至少一位學生姓名。");
        }

        const excluded = parseTokens(excludedInput.value);
        if (mode === "number") {
          const invalid = excluded.find((item) => !/^\d+$/.test(item));
          if (invalid !== undefined) {
            throw new Error(`排除名單「${invalid}」不是有效號碼，請檢查輸入。`);
          }
        }
        const excludedSet = new Set(excluded.map((item) =>
          mode === "number" ? String(Number(item)) : item.toLocaleLowerCase()
        ));
        return pool.filter((item) => {
          const key = mode === "number" ? String(Number(item)) : item.toLocaleLowerCase();
          return !excludedSet.has(key) && !(noRepeatInput.checked && drawnThisRound.has(key));
        });
      }

      function updateRemaining() {
        try {
          const available = getPool().length;
          remainingOutput.textContent = `可抽人數：${available}`;
          remainingOutput.style.color = available ? "var(--green)" : "var(--red)";
          if (!isDrawing && statusOutput.classList.contains("error")) setStatus("", false);
        } catch (error) {
          remainingOutput.textContent = "可抽人數：—";
          remainingOutput.style.color = "var(--muted)";
        }
      }

      function setMode(nextMode) {
        if (isDrawing || mode === nextMode) return;
        mode = nextMode;
        const isNumberMode = mode === "number";
        numberModeButton.setAttribute("aria-pressed", String(isNumberMode));
        nameModeButton.setAttribute("aria-pressed", String(!isNumberMode));
        numberFields.classList.toggle("hidden", !isNumberMode);
        nameFields.classList.toggle("hidden", isNumberMode);
        excludedInput.placeholder = isNumberMode ? "例如：5, 12" : "例如：王小明, 陳小華";
        drawnThisRound.clear();
        resultsOutput.replaceChildren();
        stageLabel.textContent = "按下按鈕，看看今天的幸運兒！";
        setStatus("", false);
        updateRemaining();
      }

      function randomIndex(length) {
        if (length <= 1) return 0;
        if (window.crypto && window.crypto.getRandomValues) {
          const values = new Uint32Array(1);
          const limit = Math.floor(0x100000000 / length) * length;
          do {
            window.crypto.getRandomValues(values);
          } while (values[0] >= limit);
          return values[0] % length;
        }
        return Math.floor(Math.random() * length);
      }

      function sample(pool, count) {
        const copy = pool.slice();
        for (let index = 0; index < count; index += 1) {
          const swapIndex = index + randomIndex(copy.length - index);
          [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
        }
        return copy.slice(0, count);
      }

      function playSound() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          setStatus("抽籤完成；此瀏覽器不支援音效。", false);
          return;
        }
        try {
          const audio = new AudioContextClass();
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((frequency, index) => {
            const oscillator = audio.createOscillator();
            const gain = audio.createGain();
            const startAt = audio.currentTime + index * 0.11;
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(frequency, startAt);
            gain.gain.setValueAtTime(0.0001, startAt);
            gain.gain.exponentialRampToValueAtTime(0.16, startAt + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.32);
            oscillator.connect(gain);
            gain.connect(audio.destination);
            oscillator.start(startAt);
            oscillator.stop(startAt + 0.34);
          });
          window.setTimeout(() => audio.close(), 900);
        } catch (error) {
          console.warn("無法播放抽籤音效：", error);
          setStatus("抽籤完成；瀏覽器未能播放音效。", false);
        }
      }

      function resizeConfettiCanvas() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        confettiCanvas.width = Math.floor(window.innerWidth * ratio);
        confettiCanvas.height = Math.floor(window.innerHeight * ratio);
        confettiCanvas.style.width = `${window.innerWidth}px`;
        confettiCanvas.style.height = `${window.innerHeight}px`;
        confettiContext.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function launchConfetti() {
        window.cancelAnimationFrame(confettiFrame);
        resizeConfettiCanvas();
        const colors = ["#a88bff", "#72e0b0", "#ffd166", "#ff858f", "#75d8ff"];
        const pieces = Array.from({ length: 150 }, () => ({
          x: Math.random() * window.innerWidth,
          y: -20 - Math.random() * window.innerHeight * 0.6,
          size: 5 + Math.random() * 8,
          speed: 2.5 + Math.random() * 5,
          drift: (Math.random() - 0.5) * 2.5,
          rotation: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 0.16,
          color: colors[Math.floor(Math.random() * colors.length)]
        }));
        const startedAt = performance.now();
        const duration = 2600;

        function animate(now) {
          confettiContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
          const progress = Math.min((now - startedAt) / duration, 1);
          pieces.forEach((piece) => {
            piece.x += piece.drift;
            piece.y += piece.speed;
            piece.rotation += piece.spin;
            confettiContext.save();
            confettiContext.translate(piece.x, piece.y);
            confettiContext.rotate(piece.rotation);
            confettiContext.fillStyle = piece.color;
            confettiContext.globalAlpha = 1 - progress * 0.6;
            confettiContext.fillRect(-piece.size / 2, -piece.size / 2, piece.size, piece.size * 0.62);
            confettiContext.restore();
          });
          if (progress < 1) {
            confettiFrame = window.requestAnimationFrame(animate);
          } else {
            confettiContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
          }
        }
        confettiFrame = window.requestAnimationFrame(animate);
      }

      function renderHistory() {
        historyOutput.replaceChildren();
        if (history.length === 0) {
          const empty = document.createElement("li");
          empty.className = "history-empty";
          empty.textContent = "還沒有抽籤紀錄";
          historyOutput.append(empty);
          return;
        }
        history.slice().reverse().forEach((entry) => {
          const item = document.createElement("li");
          const label = document.createElement("span");
          const time = document.createElement("time");
          label.textContent = entry.items.join("、");
          time.className = "history-time";
          time.dateTime = entry.isoTime;
          time.textContent = entry.displayTime;
          item.append(label, time);
          historyOutput.append(item);
        });
      }

      function renderResults(items) {
        resultsOutput.replaceChildren();
        items.forEach((item, index) => {
          const chip = document.createElement("span");
          chip.className = `result-chip${mode === "name" ? " name-result" : ""}`;
          chip.textContent = item;
          chip.style.animationDelay = `${index * 100}ms`;
          resultsOutput.append(chip);
        });
      }

      function finishDraw(winners) {
        renderResults(winners);
        stageLabel.textContent = "恭喜這次的幸運兒！";
        if (noRepeatInput.checked) {
          winners.forEach((winner) => {
            const key = mode === "number" ? String(Number(winner)) : winner.toLocaleLowerCase();
            drawnThisRound.add(key);
          });
        }
        const now = new Date();
        const entry = {
          items: winners,
          isoTime: now.toISOString(),
          displayTime: now.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", second: "2-digit" })
        };
        history.push(entry);
        renderHistory();
        historyAnnouncement.textContent = `新增抽籤紀錄：${winners.join("、")}`;
        setStatus(`抽出 ${winners.length} 位！`, false);
        launchConfetti();
        playSound();
        updateRemaining();
        isDrawing = false;
        drawButton.disabled = false;
        drawButton.textContent = "🎉 再抽一次";
      }

      function startDraw() {
        if (isDrawing) return;
        let available;
        let count;
        try {
          available = getPool();
          const countText = drawCountInput.value.trim();
          count = Number(countText);
          if (countText === "" || !Number.isSafeInteger(count) || count < 1) {
            throw new Error("請輸入至少 1 位的有效抽選人數。");
          }
          if (available.length < count) {
            throw new Error(`人數不足：目前符合條件的對象只有 ${available.length} 位，無法抽出 ${count} 位。請調整人數或排除名單。`);
          }
        } catch (error) {
          setStatus(error.message, true);
          return;
        }

        isDrawing = true;
        drawButton.disabled = true;
        drawButton.textContent = "✨ 正在抽選…";
        resultsOutput.replaceChildren();
        setStatus("", false);
        const animationPool = available.slice();
        let ticks = 0;
        const animation = window.setInterval(() => {
          const preview = sample(animationPool, Math.min(count, animationPool.length));
          renderResults(preview);
          stageLabel.textContent = "幸運兒即將揭曉…";
          ticks += 1;
          if (ticks >= 29) {
            window.clearInterval(animation);
            finishDraw(sample(available, count));
          }
        }, 68);
      }

      numberModeButton.addEventListener("click", () => setMode("number"));
      nameModeButton.addEventListener("click", () => setMode("name"));
      drawButton.addEventListener("click", startDraw);
      rosterInput.addEventListener("input", () => {
        saveRoster();
        updateRemaining();
      });
      [rangeStartInput, rangeEndInput, excludedInput, noRepeatInput].forEach((element) => {
        element.addEventListener("input", updateRemaining);
        element.addEventListener("change", updateRemaining);
      });
      drawCountInput.addEventListener("input", () => {
        if (statusOutput.classList.contains("error")) setStatus("", false);
      });
      resetButton.addEventListener("click", () => {
        if (isDrawing) return;
        drawnThisRound.clear();
        history = [];
        resultsOutput.replaceChildren();
        stageLabel.textContent = "按下按鈕，看看今天的幸運兒！";
        historyAnnouncement.textContent = "抽籤紀錄已重置。";
        renderHistory();
        setStatus("抽籤紀錄已重置，可以重新開始。", false);
        updateRemaining();
      });
      window.addEventListener("resize", resizeConfettiCanvas);

      loadRoster();
      renderHistory();
      resizeConfettiCanvas();
      updateRemaining();
    })();
  </script>
</body>
</html>
